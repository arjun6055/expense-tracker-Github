<head>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23172554'/%3E%3Cstop offset='.55' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='128' height='128' rx='30' fill='url(%23g)'/%3E%3Ccircle cx='64' cy='64' r='39' fill='white' opacity='.95'/%3E%3Ctext x='64' y='78' text-anchor='middle' font-size='46'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
    <meta name="theme-color" content="#101a2c">

    <style>
        :root {

        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}

        .app{max-width:1050px;margin:auto;padding-bottom:125px;min-height:100svh}
        .top{color:#fff;padding:28px 28px 24px;border-radius:0 0 38px 38px;background:radial-gradient(circle at 92% 10%,#38bdf8 0,#2563eb 23%,transparent 45%),radial-gradient(circle at 60% 120%,#1d4ed8 0,#101827 58%);position:relative;overflow:hidden}
        .top:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff20;border-radius:50%;right:-90px;bottom:-125px;box-shadow:0 0 0 32px #ffffff08,0 0 0 64px #ffffff05}
        .brand{position:relative;z-index:1}.brand h1{font-size:32px;margin:0;font-weight:900;letter-spacing:-1px}.brand p{margin:6px 0 0;color:#dbeafe;font-size:13px}
        .content{padding:16px 22px 24px;min-height:70vh}.screen{display:none}.screen.active{display:block;animation:fadein .15s cubic-bezier(0,0,.2,1)}

        .card{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow);color:var(--ink)}
        .card h2{font-size:25px;margin:0 0 16px;letter-spacing:-.45px}.card h3{font-size:20px;margin:0 0 14px;letter-spacing:-.25px}
        .hero{color:#fff;background:linear-gradient(135deg,#0f1b32 0,#173d8f 46%,#0ea5c9 100%);position:relative;overflow:hidden}

        .stat b, .cardtile .amount, .focusstat b {

            line-height: 1.2 !important; letter-spacing: -0.6px !important; white-space: nowrap !important;
            word-break: keep-all !important; overflow-wrap: normal !important; text-overflow: clip !important; overflow: visible !important;

        .stat span{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.35;white-space:normal}.hero .stat span{color:#dbeafe}
        .iconstat{display:flex;gap:10px;align-items:center;min-width:0;padding:14px 12px}

        .dark-mode .blue{background:#1e3a8a;color:#93c5fd}.dark-mode .green{background:#14532d;color:#86efac}.dark-mode .orange{background:#78350f;color:#fcd34d}.dark-mode .pink{background:#831843;color:#f9a8d4}.dark-mode .purple{background:#4c1d95;color:#c4b5fd}.dark-mode .cyan{background:#164e63;color:#67e8f9}

        .fab-mic{position:fixed;right:26px;bottom:196px;width:54px;height:54px;border-radius:50%;background:var(--card);color:var(--ink);font-size:24px;box-shadow:0 10px 25px rgba(0,0,0,.15);z-index:31;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}

        .modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:60}.modal.show{display:flex}
        .sheet{width:100%;max-width:none;max-height:94svh;overflow:auto;background:var(--card);margin:auto;padding:24px 20px;border-radius:32px 32px 0 0;box-shadow:0 -20px 70px rgba(0,0,0,.6)}
        .close{float:right}.checklist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .settingrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px}
        .switch{position:relative;width:52px;height:30px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:var(--stat-border);border-radius:99px}.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--blue)}.switch input:checked+.slider:before{transform:translateX(22px)}

        .toast{position:fixed;left:50%;bottom:145px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:12px 20px;border-radius:99px;font-size:13px;font-weight:800;display:none;z-index:80;box-shadow:0 10px 40px rgba(0,0,0,.4)}
        .txclick{cursor:pointer;transition:background .15s}.txclick:active{background:var(--stat-bg);border-radius:16px}
        .donutwrap{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}.donut{width:115px;height:115px;border-radius:50%;display:grid;place-items:center}.donut span{width:70px;height:70px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:900;font-size:18px;line-height:1.1}
        .legend{display:grid;gap:9px}.legendrow{display:flex;justify-content:space-between;gap:10px;font-size:12px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
        .hidden{display:none!important}
        .caticon{width:52px;height:52px;min-width:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
        .catname{min-width:0;flex:1}.catname .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catrow{display:flex;align-items:center;gap:12px;min-width:0;flex:1}

        .swipe-wrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
        .swipe-wrap:last-child{border-bottom:0}
        .swipe-bg{position:absolute;inset:0;display:flex;justify-content:space-between;z-index:0;background:var(--stat-bg)}
        .swipe-bg > div{width:85px;display:grid;place-items:center;font-weight:850;color:#fff;font-size:14px}
        .swipe-fg{position:relative;z-index:1;background:var(--card);border-bottom:none;transition:transform .2s cubic-bezier(.2,.8,.2,1);will-change:transform}

        .mic-btn { width:100%; padding:14px; border-radius:16px; background:#eef2ff; color:#4f46e5; font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; border:1px solid #c7d2fe; transition:0.2s }
        .mic-btn:active { background:#c7d2fe; transform:scale(0.98) }
        .cam-btn { padding:14px; border-radius:16px; background:var(--btn-sec-bg); color:var(--ink); font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px; transition:0.2s; border:1px solid var(--line); }

        #offlineBanner { position:fixed; top:0; left:0; right:0; background:var(--orange); color:#fff; text-align:center; padding:6px; font-size:12px; font-weight:800; z-index:9999; display:none; }

        #pinGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 90% 5%,#38bdf8 0,#2563eb 24%,transparent 45%),linear-gradient(145deg,#0b1425,#172554 58%,#0891b2);color:#fff;}
        #pinGate.hidden{display:none}
        .pinbox{width:min(390px,100%);background:var(--card);color:var(--ink);border-radius:36px;padding:32px 24px 28px;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center;}
        .pinlogo{width:88px;height:88px;margin:0 auto 18px;border-radius:28px;background:linear-gradient(135deg,#172554,#2563eb,#06b6d4);display:grid;place-items:center;font-size:48px;box-shadow:0 15px 35px rgba(37,99,235,.45);}
        .pinbox h1{margin:0;font-size:28px;letter-spacing:-.8px}.pinbox p{margin:8px 0 24px;color:var(--muted);font-size:14px}
        .pin-dots{display:flex;justify-content:center;gap:12px;margin:10px 0 24px}.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--line);border:1px solid var(--muted)}.pin-dot.on{background:var(--blue);border-color:var(--blue);transform:scale(1.1)}
        .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:auto}.pinpad button{height:60px;border-radius:20px;background:var(--btn-sec-bg);color:var(--ink);font-size:24px;font-weight:850;border:1px solid var(--line)}.pinpad button:active{transform:scale(.95);background:var(--blue);color:#fff}
        .pinpad .pin-del{font-size:20px}.pin-unlock{width:100%;margin-top:16px;height:56px;border-radius:20px;background:var(--dark);color:#fff;font-size:17px;font-weight:900}.pin-msg{min-height:22px;margin-top:12px;color:var(--red);font-size:13px;font-weight:750}.pin-foot{font-size:11px!important;margin:14px 0 0!important;color:var(--muted)!important}

        .monthsummary { width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }

        .manage-list { display: grid; gap: 10px; margin-top: 8px; }
        .manage-item { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
        .manage-item input { margin: 0; min-height: 48px; padding: 10px 14px; }
        .manage-item button { margin: 0; min-height: 48px; border-radius: 14px; padding: 10px 14px; }
        .manage-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
        .manage-note, .layout-note { font-size: 12px; color: var(--muted); margin: -4px 0 12px; line-height: 1.4; }
        .pin-change-box { margin-top: 24px; }
    </style>
    
    <script>
        const SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbwnBVOVjMfGkd9bB8-qU6SvQ0z_KD9kMFCLm6qu20DA8K2ikm73qB8dpVRIx0sXX4Y/exec";
        const google = {
          script: {
            get run() {
              let onSuccess = () => {}; let onFailure = console.error;
              const runner = new Proxy({}, {
                get(target, prop) {
                  if (prop === 'withSuccessHandler') return (fn) => { onSuccess = fn; return runner; };
                  if (prop === 'withFailureHandler') return (fn) => { onFailure = fn; return runner; };
                  return (...args) => {
                    fetch(SCRIPT_API_URL, {
                      method: "POST",
                      headers: { "Content-Type": "text/plain;charset=utf-8" },
                      body: JSON.stringify({ action: prop, args: args })
                    })
                    .then(res => res.text())
                    .then(text => {
                      try {
                        const data = JSON.parse(text);
                        if (data.error) onFailure(new Error(data.error));
                        else onSuccess(data.result);
                      } catch(e) {
                        onFailure(new Error("API Error. Ensure New Version was deployed."));
                      }
                    })
                    .catch(err => onFailure(err));
                  };
                }
              }); return runner;
            }
          }
        };
    </script>
</head>
<body class="pin-locked phone-device">

<div id="offlineBanner">📶 Offline Mode - Changes saved locally</div>
<div id="pinGate">
    <div class="pinbox">
        <div class="pinlogo">💰</div>
        <h1>My Expense Analyzer</h1>
        <p>Private family expense tracker</p>
        <div class="pin-dots" id="pinDots"></div>
        <div class="pinpad">
            <button onclick="pinKey('1')">1</button><button onclick="pinKey('2')">2</button><button onclick="pinKey('3')">3</button>
            <button onclick="pinKey('4')">4</button><button onclick="pinKey('5')">5</button><button onclick="pinKey('6')">6</button>
            <button onclick="pinKey('7')">7</button><button onclick="pinKey('8')">8</button><button onclick="pinKey('9')">9</button>
            <button class="pin-del" onclick="pinClear()">⌫</button><button onclick="pinKey('0')">0</button><button class="pin-del" onclick="pinBack()">←</button>
        </div>
        <button class="pin-unlock" onclick="unlockApp()">Unlock</button>
        <div class="pin-msg" id="pinMsg"></div>
        <p class="pin-foot">Enter your 4–6 digit family PIN</p>
    </div>
</div>

<div class="app">
    <header class="top"><div class="brand"><h1 id="brandTitle">My Expense Analyzer</h1><p>Google Sheet master • Mobile Expense Tracker</p></div></header>
    <main class="content" id="mainWrap">
        <section id="home" class="screen active"></section>
    </main>
</div>
<div class="toast" id="toast"></div>

<script>
    let DATA={rows:[],options:{}},SETTINGS={};
    let globalView='monthly',activeMonth='',currentScreen='home';
    const $=id=>document.getElementById(id), money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
    
    let authToken='',pinValue='';
    function renderPinDots(){let d=$('pinDots');if(!d)return;d.innerHTML=[0,1,2,3,4,5].map(i=>'<span class="pin-dot '+(i<pinValue.length?'on':'')+'"></span>').join('');}
    function pinKey(n){if(pinValue.length>=6)return;pinValue+=n;renderPinDots();if(pinValue.length===6) setTimeout(unlockApp,80);}
    function pinBack(){pinValue=pinValue.slice(0,-1);renderPinDots();}
    function pinClear(){pinValue='';renderPinDots();$('pinMsg').textContent='';}
    function unlockApp(){
        if(!/^\d{4,6}$/.test(pinValue)){ $('pinMsg').textContent='Enter a 4 to 6 digit PIN.'; return; }
        $('pinMsg').textContent='Checking…';
        google.script.run.withSuccessHandler(r=>{
            authToken=r.token;
            $('pinGate').classList.add('hidden');
            document.body.classList.remove('pin-locked');
            pinValue='';renderPinDots();init();
        }).withFailureHandler(e=>{
            $('pinMsg').textContent=(e&&e.message)||'Incorrect PIN.';
            pinValue='';renderPinDots();
        }).authenticatePin(pinValue);
    }

    function init() {
        google.script.run.withSuccessHandler(res => {
            DATA = res.appData || {rows:[], options:{}}
            SETTINGS = res.settings || {};
            $('home').innerHTML = '<div class="card"><h2>Welcome!</h2><p>App loaded successfully.</p></div>';
        }).withFailureHandler(e => alert(e.message)).getAppPayload(authToken);
    }

    window.onload=function(){
        renderPinDots();
    };
</script>
</body>
</html>
